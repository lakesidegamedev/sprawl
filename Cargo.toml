[workspace]
members = ["crates/us-gen", "crates/us-gen-cli", "crates/us-lakeside", "crates/us-render", "crates/us-sim", "crates/us-app", "crates/us-metrics", "crates/us-traffic", "crates/us-grow", "crates/us-grow-cli"]
resolver = "3"

[workspace.package]
version = "1.0.0"

edition = "2024"
rust-version = "1.96"
license = "LicenseRef-Proprietary"
publish = false

[profile.release]
overflow-checks = true
lto = "thin"

[profile.dev.package.us-gen]
opt-level = 2

[profile.dev.package.us-render]
opt-level = 2
