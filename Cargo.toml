[workspace]
members = ["crates/us-gen", "crates/us-gen-cli", "crates/us-render"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "LicenseRef-Proprietary"
publish = false

[profile.release]
overflow-checks = true
lto = "thin"

[profile.dev.package.us-gen]
opt-level = 2

[profile.dev.package.us-render]
opt-level = 2
