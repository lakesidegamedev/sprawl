name: installers
# Installers for the Lakeside launcher and the paid download: Windows (Inno Setup), Linux
# (AppImage) and macOS (dmg, ad-hoc signed). Zips are built by release.yml, not here.
# Artifact names match what the accounts publisher pulls: installers-windows-latest,
# installers-ubuntu-latest, installers-mac, each with a SHA256SUMS file, plus launcher-manifest.
on:
  push:
    tags: ["v*"]
  # Proves the packaging on any change to it. Builds only, publishes nothing.
  pull_request:
    paths:
      - ".github/workflows/installers.yml"
      - "packaging/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown to players, for example 1.0.0-preview.2"
        required: false
        default: "1.0.0-preview.2"

permissions:
  contents: read

env:
  # Until crates/us-app exists on this branch, the command line generator stands in so the
  # packaging is proven end to end. The packaged file is always named urban-sprawl.
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || (github.ref_type == 'tag' && github.ref_name) || '0.0.0-ci' }}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          if [ -d crates/us-app ]; then pkg=us-app; bin=urban-sprawl; else pkg=us-gen-cli; bin=us-gen-cli; fi
          cargo build --release --locked -p "$pkg"
          mkdir -p stage out
          cp "target/release/$bin.exe" stage/urban-sprawl.exe
      - name: Inno Setup
        run: |
          v="${VERSION#v}"
          if ! command -v iscc >/dev/null 2>&1 && [ ! -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup -y --no-progress; fi
          iscc="$(command -v iscc || echo "/c/Program Files (x86)/Inno Setup 6/ISCC.exe")"
          "$iscc" "-DDisplayVersion=$v" "-DNumericVersion=${v%%-*}" "-DAppImage=$(cygpath -w "$PWD/stage")" "-DOutDir=$(cygpath -w "$PWD/out")" packaging/windows/setup.iss
          ls -l out
      - name: Checksums
        working-directory: out
        run: sha256sum *-setup.exe | tee SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        # Public repo: pull request runs only prove the build; they never publish game files.
        if: github.event_name != 'pull_request'
        with:
          name: installers-windows-latest
          path: out/*
          if-no-files-found: error
          retention-days: 1  # public repo: anyone signed in can download artifacts

  linux:
    runs-on: ubuntu-22.04  # oldest glibc we support (2.35): a binary built on a newer Ubuntu will not start on 22.04 or 24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-xkb1 libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev
      - name: Build
        run: |
          if [ -d crates/us-app ]; then pkg=us-app; bin=urban-sprawl; else pkg=us-gen-cli; bin=us-gen-cli; fi
          cargo build --release --locked -p "$pkg"
          mkdir -p out
          python3 packaging/make-icon.py out/icon.png
          bash packaging/linux/build-appimage.sh "target/release/$bin" out/icon.png "out/UrbanSprawl-${VERSION#v}-linux.AppImage"
          rm out/icon.png
      - name: Checksums
        working-directory: out
        run: sha256sum *.AppImage | tee SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        # On pull requests this copy lives only until the launch check below has used it.
        with:
          name: installers-ubuntu-latest
          path: out/*
          if-no-files-found: error
          retention-days: 1  # public repo: anyone signed in can download artifacts

  # Start the AppImage exactly as the Lakeside launcher does, on a clean runner set up like a stock
  # desktop (a virtual display and Mesa's Vulkan driver, which Ubuntu desktop installs by default,
  # nothing else): launcher environment and a made-up handoff code. It must stay up, signed out.
  launch-check:
    needs: linux
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers-ubuntu-latest
          path: in
      - name: Only what a stock desktop has
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers
      - name: Start like the launcher and stay up 20 seconds
        run: |
          app="$(ls in/*-linux.AppImage)"
          chmod +x "$app"
          export APPIMAGE_EXTRACT_AND_RUN=1 LAKESIDE_LAUNCHER=1 LAKESIDE_LAUNCHER_VERSION=0.7.2 LAKESIDE_HANDOFF_CODE=ci-made-up-code
          xvfb-run -a -s "-screen 0 1360x820x24" bash -c "\"$app\" > out.txt 2>&1 & pid=\$!; sleep 20; if kill -0 \$pid; then echo ALIVE > alive.txt; kill \$pid; fi" || true
          echo "--- game output"; cat out.txt || true
          echo "--- log"; cat /tmp/urban-sprawl.log || true
          test -f alive.txt || { echo "the game exited before 20 seconds"; exit 1; }
          if grep -q "could not start" out.txt /tmp/urban-sprawl.log 2>/dev/null; then echo "the game is showing a start error"; exit 1; fi
          echo "game stayed up for 20 seconds"
      - name: Delete the pull request copy of the game
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" -q '.artifacts[].id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal binary
        run: |
          if [ -d crates/us-app ]; then pkg=us-app; bin=urban-sprawl; else pkg=us-gen-cli; bin=us-gen-cli; fi
          cargo build --release --locked -p "$pkg" --target aarch64-apple-darwin
          cargo build --release --locked -p "$pkg" --target x86_64-apple-darwin
          mkdir -p out
          lipo -create -output urban-sprawl "target/aarch64-apple-darwin/release/$bin" "target/x86_64-apple-darwin/release/$bin"
          lipo -info urban-sprawl
      - name: Disk image (ad-hoc signed)
        run: bash packaging/macos/make-dmg.sh urban-sprawl "${VERSION#v}" "out/UrbanSprawl-${VERSION#v}-mac.dmg"
      - name: Checksums
        working-directory: out
        run: shasum -a 256 *.dmg | tee SHA256SUMS-mac.txt
      - uses: actions/upload-artifact@v4
        # Public repo: pull request runs only prove the build; they never publish game files.
        if: github.event_name != 'pull_request'
        with:
          name: installers-mac
          path: out/*
          if-no-files-found: error
          retention-days: 1  # public repo: anyone signed in can download artifacts

  manifest:
    needs: [windows, linux, mac, launch-check]
    # pull request runs publish nothing, so there is nothing to describe
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: in
      - name: Write launcher-manifest.json
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, os
          version = os.environ["VERSION"].lstrip("v")
          kinds = {
              "-setup.exe": ("windows-x86_64", "inno"),
              "-linux.AppImage": ("linux-x86_64", "appimage"),
              "-mac.dmg": ("macos-universal", "dmg"),
          }
          files = {}
          for path in sorted(glob.glob("in/*/*")):
              for suffix, (platform, installer) in kinds.items():
                  if path.endswith(suffix):
                      data = open(path, "rb").read()
                      files[platform] = {
                          "filename": os.path.basename(path),
                          "size": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                          "installer": installer,
                      }
          missing = {p for p, _ in kinds.values()} - set(files)
          if missing:
              raise SystemExit(f"missing installers: {sorted(missing)}")
          os.makedirs("out", exist_ok=True)
          json.dump({"version": version, "files": files}, open("out/launcher-manifest.json", "w"), indent=2)
          print(json.dumps({"version": version, "files": files}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        # Public repo: pull request runs only prove the build; they never publish game files.
        if: github.event_name != 'pull_request'
        with:
          name: launcher-manifest
          path: out/launcher-manifest.json
          if-no-files-found: error
          retention-days: 1  # public repo: anyone signed in can download artifacts
