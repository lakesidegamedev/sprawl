name: release

# Portable zips of the game, built as workflow artifacts for testing on pull requests that touch
# the app or packaging. This repository is public and Urban Sprawl is a paid game: builds are
# never attached to a GitHub release. Players get the game through the Lakeside launcher.
on:
  pull_request:
    paths: [".github/workflows/release.yml", "packaging/**", "crates/us-app/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: linux-x64, os: ubuntu-22.04 } # oldest glibc we support (2.35)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev
      - name: Build
        run: cargo build --release -p us-app --locked
      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="1.0.0-preview.1"; fi
          NAME="urban-sprawl-$V-${{ matrix.name }}"
          mkdir -p dist "stage/$NAME"
          cp packaging/README.txt "stage/$NAME/README.txt"
          cp crates/us-app/assets/Silkscreen-OFL.txt "stage/$NAME/Silkscreen-OFL.txt"
          case "${{ matrix.name }}" in
            windows-x64)
              cp target/release/urban-sprawl.exe "stage/$NAME/"
              (cd stage && 7z a -tzip "../dist/$NAME.zip" "$NAME" > /dev/null)
              echo "file=dist/$NAME.zip" >> "$GITHUB_OUTPUT"
              ;;
            macos-arm64)
              APP="stage/$NAME/Urban Sprawl.app"
              mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
              cp target/release/urban-sprawl "$APP/Contents/MacOS/urban-sprawl"
              cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
              codesign --force --deep -s - "$APP"
              codesign --verify --deep --strict "$APP"
              (cd stage && ditto -c -k --keepParent "$NAME" "../dist/$NAME.zip")
              echo "file=dist/$NAME.zip" >> "$GITHUB_OUTPUT"
              ;;
            linux-x64)
              cp target/release/urban-sprawl "stage/$NAME/"
              tar -C stage -czf "dist/$NAME.tar.gz" "$NAME"
              echo "file=dist/$NAME.tar.gz" >> "$GITHUB_OUTPUT"
              ;;
          esac
          ls -la dist
      - name: Linux smoke test (starts under a virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb mesa-vulkan-drivers libxkbcommon-x11-0
          URBAN_SPRAWL_SMOKE=12 timeout 120 xvfb-run -a -s "-screen 0 1280x800x24" target/release/urban-sprawl 2>&1 | tee smoke.log
          grep -q "^smoke: day" smoke.log
      - uses: actions/upload-artifact@v4
        # Public repo: pull request runs only prove the build; they never publish game files.
        if: github.event_name != 'pull_request'
        with:
          name: urban-sprawl-${{ matrix.name }}
          path: ${{ steps.pkg.outputs.file }}
          if-no-files-found: error
          retention-days: 1  # public repo: anyone signed in can download artifacts

