name: release

on:
  # dry run: building the packages (not publishing) when packaging itself changes
  pull_request:
    paths: [".github/workflows/release.yml", "packaging/**", "crates/us-app/**"]
  push:
    tags: ["v1.0.0-preview.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create or update the pre-release (tag v1.0.0-preview.1) from this commit"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: linux-x64, os: ubuntu-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev
      - name: Build
        run: cargo build --release -p us-app --locked
      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="1.0.0-preview.1"; fi
          NAME="urban-sprawl-$V-${{ matrix.name }}"
          mkdir -p dist "stage/$NAME"
          cp packaging/README.txt "stage/$NAME/README.txt"
          cp crates/us-app/assets/Silkscreen-OFL.txt "stage/$NAME/Silkscreen-OFL.txt"
          case "${{ matrix.name }}" in
            windows-x64)
              cp target/release/urban-sprawl.exe "stage/$NAME/"
              (cd stage && powershell -NoProfile -Command "Compress-Archive -Path '$NAME' -DestinationPath '../dist/$NAME.zip'")
              echo "file=dist/$NAME.zip" >> "$GITHUB_OUTPUT"
              ;;
            macos-arm64)
              APP="stage/$NAME/Urban Sprawl.app"
              mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
              cp target/release/urban-sprawl "$APP/Contents/MacOS/urban-sprawl"
              cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
              codesign --force --deep -s - "$APP"
              codesign --verify --deep --strict "$APP"
              (cd stage && ditto -c -k --keepParent "$NAME" "../dist/$NAME.zip")
              echo "file=dist/$NAME.zip" >> "$GITHUB_OUTPUT"
              ;;
            linux-x64)
              cp target/release/urban-sprawl "stage/$NAME/"
              tar -C stage -czf "dist/$NAME.tar.gz" "$NAME"
              echo "file=dist/$NAME.tar.gz" >> "$GITHUB_OUTPUT"
              ;;
          esac
          ls -la dist
      - name: Linux smoke test (starts under a virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb mesa-vulkan-drivers
          URBAN_SPRAWL_SMOKE=12 timeout 120 xvfb-run -a -s "-screen 0 1280x800x24" target/release/urban-sprawl 2>&1 | tee smoke.log
          grep -q "^smoke: day" smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: urban-sprawl-${{ matrix.name }}
          path: ${{ steps.pkg.outputs.file }}
          if-no-files-found: error

  publish:
    name: publish pre-release
    needs: build
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create or update the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v1.0.0-preview.1"; fi
          ls -la assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --target "$GITHUB_SHA" --prerelease \
              --title "Urban Sprawl 1.0.0 preview 1" --notes-file .github/release-notes.md
          fi
