# Xcode project for the iOS app, generated with xcodegen (see prepare.sh). The game is the Rust
# library us-app; a build phase compiles it for the chosen SDK and a tiny C file starts it.
name: UrbanSprawl
options:
  bundleIdPrefix: net.lakesidegames
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: ${MARKETING_VERSION}
    CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  UrbanSprawl:
    type: application
    platform: iOS
    sources:
      - path: main.c
      - path: Assets.xcassets
    preBuildScripts:
      - name: Build the Rust game
        script: bash "${SRCROOT}/build-rust.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreFoundation.framework
      - sdk: Security.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreText.framework
    settings:
      base:
        PRODUCT_NAME: Urban Sprawl
        PRODUCT_BUNDLE_IDENTIFIER: net.lakesidegames.urbansprawl
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Urban Sprawl
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.strategy-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(DERIVED_FILE_DIR)/rust"]
        OTHER_LDFLAGS: ["$(inherited)", "-lus_app", "-lc++", "-lobjc"]
schemes:
  UrbanSprawl:
    build:
      targets:
        UrbanSprawl: all
