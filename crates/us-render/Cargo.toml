[package]
name = "us-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Urban Sprawl 3D renderer: draws a generated town in a cel look with wgpu, offscreen or into a native surface."

[dependencies]
us-gen = { path = "../us-gen" }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "dx12", "metal"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
glam = "0.30"
libm = "=0.2.16"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
