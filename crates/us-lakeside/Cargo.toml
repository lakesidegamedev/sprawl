[package]
name = "us-lakeside"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Lakeside launcher handoff, optional in-game sign-in and the Lakeside updater for Urban Sprawl. No UI."

[dependencies]
ureq = { version = "=2.12.1", default-features = false, features = ["tls", "json"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
