[package]
name = "us-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Urban Sprawl desktop app: window, menus, camera and the playable town."

[lib]
path = "src/lib.rs"
# the static library is what the iOS app links; desktop uses the rlib through the binary
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "urban-sprawl"
path = "src/main.rs"

[dependencies]
us-gen = { path = "../us-gen" }
us-sim = { path = "../us-sim" }
us-render = { path = "../us-render" }
us-lakeside = { path = "../us-lakeside" }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "gles", "dx12", "metal"] }
winit = { version = "0.30.13", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "rwh_06"] }
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", default-features = false }
egui-winit = { version = "0.37.0", default-features = false, features = ["x11", "wayland"] }
glam = "0.30"
pollster = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.5"
